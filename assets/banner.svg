<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="podcast-this-tech-stuff — turn any technical doc into a two-host podcast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f24"/>
      <stop offset="0.55" stop-color="#1b1340"/>
      <stop offset="1" stop-color="#3a1a55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>

  <!-- ===== LEFT: the technical document ===== -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="190" height="240" rx="14" fill="#f5f6fb"/>
    <rect x="0" y="0" width="190" height="240" rx="14" fill="none" stroke="#c7c9e8" stroke-width="1.5"/>
    <rect x="26" y="34" width="120" height="12" rx="6" fill="#3a1a55"/>
    <rect x="26" y="66" width="138" height="7" rx="3.5" fill="#9aa0c7"/>
    <rect x="26" y="84" width="138" height="7" rx="3.5" fill="#9aa0c7"/>
    <rect x="26" y="102" width="100" height="7" rx="3.5" fill="#9aa0c7"/>
    <!-- a little diagram inside the doc -->
    <rect x="26" y="128" width="60" height="44" rx="6" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="104" y="128" width="60" height="44" rx="6" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="86" y1="150" x2="104" y2="150" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="26" y="190" width="138" height="7" rx="3.5" fill="#9aa0c7"/>
    <rect x="26" y="208" width="110" height="7" rx="3.5" fill="#9aa0c7"/>
    <text x="95" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#b9bce0" text-anchor="middle">PDF · doc · diagram</text>
  </g>

  <!-- ===== FLOW ARROW ===== -->
  <g transform="translate(320 216)">
    <path d="M0 0 H120" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 -12 L138 0 L112 12 Z" fill="#22d3ee"/>
    <g fill="#c4b5fd">
      <circle cx="34" cy="-30" r="3.5"/>
      <circle cx="70" cy="-40" r="2.5"/>
      <circle cx="58" cy="34" r="3"/>
      <circle cx="96" cy="26" r="2"/>
    </g>
  </g>

  <!-- ===== RIGHT: the podcast ===== -->
  <g transform="translate(520 70)">
    <!-- headphones -->
    <g transform="translate(180 8)">
      <path d="M-78 86 A78 78 0 0 1 78 86" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
      <rect x="-100" y="78" width="34" height="58" rx="14" fill="#8b5cf6"/>
      <rect x="66" y="78" width="34" height="58" rx="14" fill="#22d3ee"/>
    </g>

    <!-- two host bubbles -->
    <g transform="translate(40 150)">
      <circle cx="0" cy="0" r="46" fill="#8b5cf6"/>
      <text x="0" y="14" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    </g>
    <g transform="translate(280 150)">
      <circle cx="0" cy="0" r="46" fill="#22d3ee"/>
      <text x="0" y="14" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0d0f24" text-anchor="middle">B</text>
    </g>

    <!-- audio waveform between the hosts -->
    <g transform="translate(160 150)" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <line x1="-78" y1="-14" x2="-78" y2="14"/>
      <line x1="-58" y1="-30" x2="-58" y2="30"/>
      <line x1="-38" y1="-46" x2="-38" y2="46"/>
      <line x1="-18" y1="-22" x2="-18" y2="22"/>
      <line x1="2"   y1="-52" x2="2"   y2="52"/>
      <line x1="22"  y1="-30" x2="22"  y2="30"/>
      <line x1="42"  y1="-44" x2="42"  y2="44"/>
      <line x1="62"  y1="-18" x2="62"  y2="18"/>
      <line x1="82"  y1="-34" x2="82"  y2="34"/>
    </g>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="96" y="372" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" letter-spacing="3" fill="#7c83b8">CLAUDE CODE SKILL</text>
  <text x="640" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">podcast-this-tech-stuff</text>
  <text x="640" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c4b5fd" text-anchor="middle">Any technical doc → a tight 10–20 min two-host podcast you can follow on the go</text>
</svg>
